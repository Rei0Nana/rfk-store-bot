<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RFK STORE - ADMIN V5 PIN 042326</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#141018;color:#ffc2d9;padding:12px;padding-bottom:80px}
.card{background:#231c28;border-radius:16px;padding:14px;margin:10px 0;border:1px solid #3a2d3f;box-shadow:0 4px 12px #00000080}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #3a2d3f;background:#141018;color:white;margin:6px 0}
.btn{width:100%;padding:12px;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-pink{background:#e84393;color:white}
.btn-green{background:#00c853;color:white}
.btn-red{background:#ff3b3b;color:white}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;color:white;font-weight:700}
.berjalan{background:orange}.selesai{background:#00c853}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat{background:#231c28;padding:12px;border-radius:12px;text-align:center;border:1px solid #3a2d3f}
.stat b{font-size:22px;display:block;color:#ff8fab}
.hidden{display:none}
.price-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #2e2433}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0;position:sticky;top:0;background:#141018;z-index:10}
.tab{padding:10px 18px;border-radius:22px;background:#231c28;border:1px solid #3a2d3f;cursor:pointer;white-space:nowrap;font-weight:800;font-size:13px;position:relative}
.tab.active{background:#e84393;color:white}
.tab .dot{position:absolute;top:-6px;right:-6px;background:#ff3b3b;color:white;border-radius:50%;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid #141018}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, setDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyBIcy7GyQCIffmDwzdha5R2omg26yzOKLo", authDomain: "rfk-store.firebaseapp.com", projectId: "rfk-store", storageBucket: "rfk-store.firebasestorage.app", messagingSenderId: "104621070837", appId: "1:104621070837:web:65dd7268d037a0a9b728bc" };
const app = initializeApp(firebaseConfig); 
const db = getFirestore(app);
const auth = getAuth(app);
window.db=db; window.auth=auth;
window.fs={collection, onSnapshot, doc, updateDoc, deleteDoc, setDoc, query, orderBy, signInWithEmailAndPassword, onAuthStateChanged, signOut};
</script>
</head>
<body>
<div id="login">
<h2>🔐 LOGIN ADMIN</h2>
<div class="card">
<input id="email" type="email" placeholder="Email Admin">
<input id="pw" type="password" placeholder="Password">
<input id="pin" type="password" placeholder="PIN Admin">
<button class="btn btn-pink" onclick="login()">Masuk Dashboard</button>
<div id="loginMsg" style="color:#ff8fab;margin-top:8px;font-size:12px"></div>
</div>
</div>

<div id="dash" class="hidden">
<h2>📊 Dashboard RFK STORE <small id="adminEmail" style="font-size:11px;color:#888"></small></h2>
<div class="grid">
<div class="stat"><b id="totalOrder">0</b><small>Total</small></div>
<div class="stat"><b id="totalJalan">0</b><small>Berjalan</small></div>
<div class="stat"><b id="totalSelesai">0</b><small>Selesai</small></div>
</div>

<div class="card">
<h3>💰 BOT HARGA</h3>
<input id="p_game" placeholder="Game: mobile legend / pubg / roblox / valorant">
<input id="p_item" placeholder="Item: 86 Diamonds">
<input id="p_harga" type="number" placeholder="Harga Jual">
<input id="p_modal" type="number" placeholder="Modal (opsional)">
<button class="btn btn-pink" onclick="updateHarga()">🚀 Update Realtime</button>
<div id="listHarga" style="margin-top:12px"></div>
</div>

<div class="tabs">
<div class="tab active" data-game="all" onclick="setGame('all')">ALL <span id="dot-all"></span></div>
<div class="tab" data-game="ml" onclick="setGame('ml')">ML <span id="dot-ml"></span></div>
<div class="tab" data-game="pubg" onclick="setGame('pubg')">PUBG <span id="dot-pubg"></span></div>
<div class="tab" data-game="roblox" onclick="setGame('roblox')">ROBLOX <span id="dot-roblox"></span></div>
<div class="tab" data-game="valorant" onclick="setGame('valorant')">VALO <span id="dot-valorant"></span></div>
</div>

<div class="card"><input id="search" placeholder="🔍 Cari ID / Game..." oninput="filter()"></div>

<h3 id="titleJalan">🔥 Berjalan - ALL</h3><div id="listJalan"></div>
<h3 id="titleSelesai">✅ Selesai - ALL</h3><div id="listSelesai"></div>

<button class="btn btn-red" onclick="logout()">Logout</button>
</div>

<script>
let allData=[];let curGame='all';
async function login(){
  let email=document.getElementById('email').value.trim();
  let pw=document.getElementById('pw').value;
  let pin=document.getElementById('pin').value;
  let msg=document.getElementById('loginMsg');
  if(!email||!pw||!pin) return msg.innerText='Isi semua!';
  if(pin!=='042326') return msg.innerText='PIN salah! Harus 042326';
  try{
    msg.innerText='Login...';
    let cred=await window.fs.signInWithEmailAndPassword(window.auth,email,pw);
    localStorage.setItem('rfk-admin','true');
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dash').classList.remove('hidden');
    document.getElementById('adminEmail').innerText='👤 '+cred.user.email;
    load();
  }catch(e){msg.innerText='Gagal: '+e.message;}
}
window.fs.onAuthStateChanged(window.auth,(user)=>{
  if(user && localStorage.getItem('rfk-admin')==='true'){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dash').classList.remove('hidden');
    document.getElementById('adminEmail').innerText='👤 '+user.email;
    load();
  }
});
function logout(){window.fs.signOut(window.auth);localStorage.removeItem('rfk-admin');location.reload();}
function load(){
  const q=window.fs.query(window.fs.collection(window.db,'orders'),window.fs.orderBy('createdAt','desc'));
  window.fs.onSnapshot(q,s=>{allData=[];s.forEach(d=>{allData.push({id:d.id,...d.data()})});render();});
  loadHarga();
}
function normGame(g){let s=(g||'').toLowerCase();if(s.includes('ml')||s.includes('mobile')||s.includes('legend'))return'ml';if(s.includes('pubg'))return'pubg';if(s.includes('roblox')||s.includes('robux'))return'roblox';if(s.includes('valo'))return'valorant';return'other';}
function setGame(g){curGame=g;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelector(`.tab[data-game="${g}"]`).classList.add('active');render();}
function render(){
  let filtered=curGame==='all'?allData:allData.filter(o=>normGame(o.game)===curGame);
  let k=document.getElementById('search').value.toLowerCase();
  if(k)filtered=filtered.filter(o=>JSON.stringify(o).toLowerCase().includes(k));
  let counts={ml:0,pubg:0,roblox:0,valorant:0,all:0};
  allData.forEach(o=>{if(o.status==='berjalan'){counts.all++;let ng=normGame(o.game);if(counts[ng]!==undefined)counts[ng]++;}});
  ['all','ml','pubg','roblox','valorant'].forEach(key=>{let el=document.getElementById('dot-'+key);el.innerHTML=counts[key]>0?`<span class="dot">${counts[key]}</span>`:'';});
  let jalan='',selesai='',curJ=0,curS=0;
  filtered.forEach(o=>{if(o.status==='berjalan')curJ++;else curS++;});
  filtered.forEach(o=>{
    let t=o.createdAt?new Date(o.createdAt).toLocaleString('id-ID'):'-';
    let card=`<div class="card"><b>${o.game} - ${o.item}</b> <span class="badge ${o.status}">${o.status}</span><br><small>${t} | ${o.username||'guest'}</small><br><br>ID: <b>${o.id1||'-'}</b><br>Harga: Rp ${o.price}<br><br>${o.status==='berjalan'?`<button class="btn btn-green" onclick="selesai('${o.id}')">✅ Selesaikan</button>`:''}<button class="btn btn-red" onclick="hapus('${o.id}')">🗑️ Hapus</button></div>`;
    if(o.status==='berjalan')jalan+=card;else selesai+=card;
  });
  document.getElementById('titleJalan').innerText=`🔥 Berjalan - ${curGame.toUpperCase()} (${curJ})`;
  document.getElementById('titleSelesai').innerText=`✅ Selesai - ${curGame.toUpperCase()} (${curS})`;
  document.getElementById('listJalan').innerHTML=jalan||'<div class=card>Kosong</div>';
  document.getElementById('listSelesai').innerHTML=selesai||'<div class=card>Kosong</div>';
  document.getElementById('totalOrder').innerText=allData.length;
  document.getElementById('totalJalan').innerText=counts.all;
  document.getElementById('totalSelesai').innerText=allData.length-counts.all;
}
function filter(){render();}
async function updateHarga(){let g=document.getElementById('p_game').value.toLowerCase().trim();let i=document.getElementById('p_item').value.toLowerCase().trim();let h=Number(document.getElementById('p_harga').value);if(!g||!i||!h)return alert('Isi Game, Item, Harga!');let id=g+'_'+i.replace(/ /g,'_');try{await window.fs.setDoc(window.fs.doc(window.db,'prices',id),{game:g,item:i,price:h,updated:Date.now()});alert('Berhasil!');}catch(e){alert(e.message)}}
function loadHarga(){window.fs.onSnapshot(window.fs.collection(window.db,'prices'),s=>{let html='';s.forEach(d=>{let p=d.data();html+=`<div class=price-item><span>${p.game} - ${p.item}<br><small>Rp ${p.price}</small></span></div>`;});document.getElementById('listHarga').innerHTML=html||'Kosong';});}
async function selesai(id){if(!confirm('Selesaikan?'))return;try{await window.fs.updateDoc(window.fs.doc(window.db,'orders',id),{status:'selesai'});}catch(e){alert(e.message);}}
async function hapus(id){if(!confirm('Hapus?'))return;try{await window.fs.deleteDoc(window.fs.doc(window.db,'orders',id));}catch(e){alert(e.message);}}
</script>
</body>
</html>
