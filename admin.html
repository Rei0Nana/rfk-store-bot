<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RFK STORE - ADMIN PANEL V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#141018;color:#ffc2d9;padding:12px;padding-bottom:80px}
.card{background:#231c28;border-radius:16px;padding:14px;margin:10px 0;border:1px solid #3a2d3f;box-shadow:0 4px 12px #00000080}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #3a2d3f;background:#141018;color:white;margin:6px 0}
.btn{width:100%;padding:12px;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-pink{background:#e84393;color:white}
.btn-green{background:#00c853;color:white}
.btn-red{background:#ff3b3b;color:white}
.btn-yellow{background:#ffb300;color:black}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;color:white;font-weight:700}
.berjalan{background:orange}.selesai{background:#00c853}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat{background:#231c28;padding:12px;border-radius:12px;text-align:center;border:1px solid #3a2d3f}
.stat b{font-size:22px;display:block;color:#ff8fab}
.hidden{display:none}
.price-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #2e2433}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, setDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyBIcy7GyQCIffmDwzdha5R2omg26yzOKLo", authDomain: "rfk-store.firebaseapp.com", projectId: "rfk-store", storageBucket: "rfk-store.firebasestorage.app", messagingSenderId: "104621070837", appId: "1:104621070837:web:65dd7268d037a0a9b728bc" };
const app = initializeApp(firebaseConfig); 
const db = getFirestore(app);
const auth = getAuth(app);
window.db=db; window.auth=auth;
window.fs={collection, onSnapshot, doc, updateDoc, deleteDoc, setDoc, query, orderBy, signInWithEmailAndPassword, onAuthStateChanged, signOut};
</script>
</head>
<body>
<div id="login">
<h2>🔐 RFK STORE ADMIN V2</h2>
<div class="card">
<input id="pass" type="password" placeholder="PIN Admin RFK042326">
<input id="email" type="email" placeholder="Email Admin (natasyareika@gmail.com)" value="natasyareika@gmail.com">
<input id="pw" type="password" placeholder="Password Firebase Admin">
<button class="btn btn-pink" onclick="login()">Masuk Dashboard</button>
<small style="color:#888">PIN + Email Firebase harus benar biar bisa Selesaikan pesanan</small>
<div id="loginMsg" style="color:#ff8fab;margin-top:8px"></div>
</div>
</div>

<div id="dash" class="hidden">
<h2>📊 Dashboard RFK STORE <small id="adminEmail" style="font-size:12px;color:#888"></small></h2>
<div class="grid">
<div class="stat"><b id="totalOrder">0</b><small>Total Order</small></div>
<div class="stat"><b id="totalJalan">0</b><small>Berjalan</small></div>
<div class="stat"><b id="totalSelesai">0</b><small>Selesai</small></div>
</div>

<div class="card">
<h3>💰 BOT HARGA REALTIME</h3>
<input id="p_game" placeholder="Game: mobile legend / pubg / roblox / valorant">
<input id="p_item" placeholder="Item: 86 Diamonds">
<input id="p_harga" type="number" placeholder="Harga Jual">
<input id="p_modal" type="number" placeholder="Modal Barongsay (opsional)">
<button class="btn btn-pink" onclick="updateHarga()">🚀 Update Realtime</button>
<div id="listHarga" style="margin-top:12px"></div>
</div>

<div class="card">
<input id="search" placeholder="🔍 Cari ID / Game / Username..." oninput="filter()">
</div>

<h3>🔥 Pesanan Berjalan</h3>
<div id="listJalan"></div>

<h3>✅ Riwayat Selesai</h3>
<div id="listSelesai"></div>

<button class="btn btn-red" onclick="logout()">Logout Admin</button>
</div>

<script>
let allData=[];
let currentAdmin=null;

async function login(){
  let pin = document.getElementById('pass').value;
  let email = document.getElementById('email').value.trim();
  let pw = document.getElementById('pw').value;
  let msg = document.getElementById('loginMsg');
  if(pin!=='RFK042326') return msg.innerText='PIN salah! Harus RFK042326';
  if(!email||!pw) return msg.innerText='Isi email & password Firebase!';
  try{
    msg.innerText='Login...';
    let cred = await window.fs.signInWithEmailAndPassword(window.auth,email,pw);
    localStorage.setItem('rfk-admin','true');
    msg.innerText='Berhasil!';
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dash').classList.remove('hidden');
    document.getElementById('adminEmail').innerText='👤 '+cred.user.email;
    load();
  }catch(e){
    msg.innerText='Gagal: '+e.message;
  }
}

window.fs.onAuthStateChanged(window.auth,(user)=>{
  if(user && localStorage.getItem('rfk-admin')==='true'){
    currentAdmin=user;
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dash').classList.remove('hidden');
    document.getElementById('adminEmail').innerText='👤 '+user.email;
    load();
  }
});

function logout(){ 
  window.fs.signOut(window.auth);
  localStorage.removeItem('rfk-admin');
  location.reload();
}

function load(){
  const q=window.fs.query(window.fs.collection(window.db,'orders'),window.fs.orderBy('createdAt','desc'));
  window.fs.onSnapshot(q,s=>{
    allData=[];
    s.forEach(d=>{allData.push({id:d.id,...d.data()})});
    render(allData);
  });
  loadHarga();
}

function render(data){
  let jalan='',selesai='';let cJ=0,cS=0;
  data.forEach(o=>{
    let t=o.createdAt?new Date(o.createdAt).toLocaleString('id-ID'):'-';
    let card=`<div class="card">
    <b>${o.game} - ${o.item}</b> <span class="badge ${o.status}">${o.status}</span><br>
    <small style="color:#888">${t} | ${o.username||'guest'} | ${o.email||''}</small><br><br>
    ID: <b>${o.id1||'-'}</b> ${o.id2||''}<br>
    ${o.id3?`Backup: <b style="color:#ff8fab">${o.id3.substring(0,40)}...</b><br>`:''}
    Harga: <b>Rp ${o.price}</b><br>
    Device: <small>${o.deviceId||'-'}</small><br><br>
    ${o.status==='berjalan'?`<button class="btn btn-green" onclick="selesai('${o.id}')">✅ Selesaikan</button>`:''}
    <button class="btn btn-red" onclick="hapus('${o.id}')">🗑️ Hapus</button>
    </div>`;
    if(o.status==='berjalan'){jalan+=card;cJ++;}else{selesai+=card;cS++;}
  });
  document.getElementById('listJalan').innerHTML=jalan||'<div class=card>Kosong</div>';
  document.getElementById('listSelesai').innerHTML=selesai||'<div class=card>Kosong</div>';
  document.getElementById('totalOrder').innerText=data.length;
  document.getElementById('totalJalan').innerText=cJ;
  document.getElementById('totalSelesai').innerText=cS;
}

async function updateHarga(){
  let g=document.getElementById('p_game').value.toLowerCase().trim();
  let i=document.getElementById('p_item').value.toLowerCase().trim();
  let h=Number(document.getElementById('p_harga').value);
  let m=Number(document.getElementById('p_modal').value)||0;
  if(!g||!i||!h) return alert('Isi Game, Item, Harga!');
  let id=g+'_'+i.replace(/ /g,'_');
  try{
    await window.fs.setDoc(window.fs.doc(window.db,'prices',id),{game:g,item:i,price:h,modal:m,updated:Date.now()});
    alert('Berhasil update '+i+' jadi Rp '+h);
  }catch(e){alert('Gagal update harga: '+e.message)}
}

function loadHarga(){
  window.fs.onSnapshot(window.fs.collection(window.db,'prices'),s=>{
    let html='';
    s.forEach(d=>{
      let p=d.data();
      let untung = p.modal?` (Untung Rp ${p.price-p.modal})`:'';
      html+=`<div class=price-item><span>${p.game} - ${p.item}<br><small style=color:#888>Rp ${p.price} ${untung}</small></span><button onclick="editHarga('${d.id}','${p.game}','${p.item}',${p.price})" style="background:#3a2d3f;color:white;border:none;padding:6px 12px;border-radius:8px">Edit</button></div>`;
    });
    document.getElementById('listHarga').innerHTML=html||'Belum ada harga custom';
  });
}

function editHarga(id,g,i,p){
  document.getElementById('p_game').value=g;
  document.getElementById('p_item').value=i;
  document.getElementById('p_harga').value=p;
  window.scrollTo(0,0);
}

function filter(){
  let k=document.getElementById('search').value.toLowerCase();
  let f=allData.filter(o=> JSON.stringify(o).toLowerCase().includes(k));
  render(f);
}
async function selesai(id){
  if(!confirm('Selesaikan pesanan ini?')) return;
  try{
    await window.fs.updateDoc(window.fs.doc(window.db,'orders',id),{status:'selesai', finishedAt: Date.now(), finishedBy: currentAdmin?currentAdmin.email:'admin'});
    alert('✅ Berhasil diselesaikan!');
  }catch(e){
    alert('❌ Gagal Selesaikan: '+e.message+'\n\nPastikan rules allow update untuk email natasyareika@gmail.com sudah publish!');
  }
}
async function hapus(id){
  if(!confirm('Hapus permanen?')) return;
  try{
    await window.fs.deleteDoc(window.fs.doc(window.db,'orders',id));
  }catch(e){ alert('Gagal hapus: '+e.message) }
}
</script>
</body>
</html>
