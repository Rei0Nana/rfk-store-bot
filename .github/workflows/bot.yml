name: RFK Bot - Auto Cek Harga

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Run bot
        run: node cek-harga.js
      - name: Save harga
        run: |
          git config user.name "RFK Bot"
          git config user.email "bot@reionana.id"
          git add harga-jual.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update harga +10%" && git push)
